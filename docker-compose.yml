services:
  # ── App Database ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: codequest_postgres
    environment:
      POSTGRES_USER: codequest
      POSTGRES_PASSWORD: codequest_secret
      POSTGRES_DB: codequest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codequest"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codequest_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Judge0 CE (Self-hosted Code Execution) ─────────────
  judge0_db:
    image: postgres:16-alpine
    container_name: judge0_postgres
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0secret
      POSTGRES_DB: judge0
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0"]
      interval: 5s
      timeout: 5s
      retries: 5

  judge0_redis:
    image: redis:7-alpine
    container_name: judge0_redis
    command: redis-server --appendonly yes --requirepass "judge0redis"
    volumes:
      - judge0_redis_data:/data

  judge0_server:
    image: judge0/judge0:1.13.1
    container_name: judge0_server
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    depends_on:
      judge0_db:
        condition: service_healthy
      judge0_redis:
        condition: service_started

  judge0_workers:
    image: judge0/judge0:1.13.1
    container_name: judge0_workers
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    restart: always
    depends_on:
      judge0_db:
        condition: service_healthy
      judge0_redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  judge0_postgres_data:
  judge0_redis_data:
